name = "bra-b-backend"
main = "src/index.ts"
compatibility_date = "2024-03-09"

[dev]
port = 8787

[vars]
API_VERSION = "v1"

[http_headers]
"/*" = { Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS", Access-Control-Allow-Headers = "Content-Type, Authorization" }
